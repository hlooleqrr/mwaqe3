<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width,initial-scale=1,viewport-fit=cover"
>

<title>حلول تمويلية | بدون تعقيدات</title>

<meta name="theme-color" content="#ffffff">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link
  href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;600;700;800;900&display=swap"
  rel="stylesheet"
>

<script
  src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"
  defer
></script>

<style>

:root{
  --bg:#f5f7f9;
  --white:#ffffff;
  --text:#172126;
  --soft:#637279;
  --muted:#8c989d;
  --blue:#316de5;
  --blue2:#5185eb;
  --blue-soft:#edf3ff;
  --green:#17795c;
  --green-soft:#edf8f4;
  --warm:#ad6d59;
  --warm2:#ce8870;
  --warm-soft:#faf3ef;
  --gold:#b97d26;
  --gold-soft:#fff3dd;
  --purple:#675fca;
  --border:rgba(29,45,54,.075);
  --shadow:0 14px 42px rgba(27,42,50,.07);
  --shadow-lg:0 26px 70px rgba(27,42,50,.12);
}

*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html{
  scroll-behavior:smooth;
}

body{
  margin:0;
  min-height:100vh;
  font-family:"Tajawal",sans-serif;
  color:var(--text);
  background:
    linear-gradient(
      180deg,
      #ffffff 0%,
      #f9fafb 50%,
      #f3f5f7 100%
    );
  overflow-x:hidden;
  padding-bottom:110px;
}

button,
a{
  font:inherit;
}

button{
  border:0;
}

a{
  color:inherit;
  text-decoration:none;
}

svg{
  display:block;
}

/* =========================
   خلفية
========================= */

.background{
  position:fixed;
  inset:0;
  z-index:-10;
  pointer-events:none;
  overflow:hidden;
}

.glow{
  position:absolute;
  border-radius:50%;
  filter:blur(85px);
  opacity:.07;
}

.glow.one{
  width:380px;
  height:380px;
  right:-180px;
  top:-180px;
  background:#4d83e8;
}

.glow.two{
  width:350px;
  height:350px;
  left:-200px;
  top:42%;
  background:#ce8e74;
}

.glow.three{
  width:350px;
  height:350px;
  right:-180px;
  bottom:-190px;
  background:#7c6fd4;
}

.app{
  width:100%;
  max-width:850px;
  margin:auto;
}

/* =========================
   الهيدر
========================= */

.header{
  position:sticky;
  top:0;
  z-index:500;

  padding:
    max(8px,env(safe-area-inset-top))
    14px
    7px;

  background:rgba(255,255,255,.91);

  backdrop-filter:
    blur(23px)
    saturate(145%);

  -webkit-backdrop-filter:
    blur(23px)
    saturate(145%);

  border-bottom:
    1px solid rgba(32,48,57,.045);
}

.header-inner{
  width:100%;
  max-width:850px;
  min-height:62px;
  margin:auto;

  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
}

.brand{
  display:flex;
  align-items:center;
  gap:10px;
  min-width:0;
}

.brand-logo{
  width:45px;
  height:45px;
  flex:0 0 auto;

  display:grid;
  place-items:center;

  border-radius:16px;

  color:#fff;

  background:
    linear-gradient(
      145deg,
      #356ddd,
      #6f62cf
    );

  box-shadow:
    0 10px 24px
    rgba(58,85,172,.18);
}

.brand-logo svg{
  width:24px;
  height:24px;
}

.brand-title{
  font-size:15px;
  font-weight:900;
}

.brand-sub{
  margin-top:2px;
  color:#7b898f;
  font-size:10.3px;
  font-weight:700;
  white-space:nowrap;
}

.brand-sub strong{
  color:#177156;
}

.back-btn{
  min-width:80px;
  height:42px;
  padding:0 12px;

  display:none;
  align-items:center;
  justify-content:center;
  gap:6px;

  border-radius:14px;

  color:#48585f;
  background:#fff;

  border:1px solid var(--border);

  box-shadow:
    0 6px 18px
    rgba(30,46,54,.05);

  font-size:12px;
  font-weight:900;

  cursor:pointer;
}

.back-btn svg{
  width:18px;
  height:18px;
}

body.detail-mode .back-btn{
  display:flex;
}

/* =========================
   الترحيب
========================= */

.welcome-wrap{
  padding:
    14px
    14px
    2px;
}

.welcome{
  padding:17px 18px;

  border-radius:23px;

  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:14px;

  background:#fff;

  border:
    1px solid
    rgba(29,45,54,.06);

  box-shadow:var(--shadow);
}

.welcome-right{
  min-width:0;
}

.greeting{
  color:#3466c6;
  font-size:20px;
  line-height:1.3;
  font-weight:900;
}

.welcome-text{
  margin-top:4px;

  color:#6f7e84;

  font-size:12px;
  font-weight:700;
}

.date-box{
  flex:0 0 auto;
  text-align:left;
}

.live-time{
  direction:rtl;

  color:#27373e;

  font-size:18px;
  font-weight:900;

  white-space:nowrap;
}

.date-line{
  margin-top:3px;

  color:#879297;

  font-size:9.5px;
  font-weight:700;

  white-space:nowrap;
}

/* =========================
   نصيحة اليوم
========================= */

.tip-wrap{
  padding:
    8px
    14px
    0;
}

.tip-bar{
  height:43px;

  display:flex;
  align-items:center;

  overflow:hidden;

  border-radius:17px;

  background:#fff;

  border:
    1px solid
    rgba(85,59,50,.065);

  box-shadow:
    0 7px 21px
    rgba(52,39,34,.035);
}

.tip-label{
  height:100%;
  flex:0 0 auto;

  padding:0 13px;

  display:flex;
  align-items:center;
  gap:7px;

  color:#fff;

  background:
    linear-gradient(
      135deg,
      #a76854,
      #c9856d
    );

  font-size:10.5px;
  font-weight:900;

  white-space:nowrap;
}

.tip-label-icon{
  width:22px;
  height:22px;

  display:grid;
  place-items:center;

  border-radius:8px;

  background:
    rgba(255,255,255,.14);
}

.tip-label-icon svg{
  width:13px;
  height:13px;
}

.tip-window{
  flex:1;
  min-width:0;

  overflow:hidden;
  direction:ltr;
}

.tip-track{
  width:max-content;

  display:flex;
  align-items:center;

  gap:100px;

  padding:
    0 110px;

  animation:
    tipMove
    980s
    linear
    infinite;
}

.tip-item{
  direction:rtl;
  white-space:nowrap;

  color:#6c787d;

  font-size:11px;
  font-weight:600;
}

.tip-item::before{
  content:"•";

  margin-left:10px;

  color:#b97963;
}

@keyframes tipMove{
  from{
    transform:translateX(0);
  }

  to{
    transform:translateX(-50%);
  }
}

/* =========================
   الشاشات

   الرئيسية ظاهرة افتراضيًا
   حتى بدون JavaScript
========================= */

.page-screen{
  display:none;
}

#home{
  display:block;
}

.page-screen.active{
  display:block;
}

body.js-ready .page-screen{
  display:none;
}

body.js-ready .page-screen.active{
  display:block;
}

.page-screen.active{
  animation:
    pageIn
    .32s
    ease
    both;
}

@keyframes pageIn{
  from{
    opacity:0;
    transform:translateY(10px);
  }

  to{
    opacity:1;
    transform:translateY(0);
  }
}

/* =========================
   الرئيسية
========================= */

.hero{
  padding:
    42px
    18px
    18px;

  text-align:center;
}

.hero h1{
  margin:0;

  font-size:
    clamp(
      31px,
      8.4vw,
      46px
    );

  line-height:1.2;

  font-weight:900;

  letter-spacing:-1px;
}

.hero h1 span{
  color:#3568cf;
}

.hero-sub{
  margin-top:7px;

  color:#65757b;

  font-size:15px;
  font-weight:650;
}

.choose-title{
  margin-top:30px;

  color:#69787e;

  font-size:13px;
  font-weight:900;
}

/* =========================
   القائمة الرئيسية
========================= */

.service-list{
  padding:
    8px
    14px
    2px;

  display:grid;

  gap:13px;
}

.service-card{
  width:100%;
  min-height:130px;

  padding:12px;

  display:flex;
  align-items:center;
  gap:14px;

  position:relative;

  text-align:right;

  border-radius:27px;

  background:#fff;

  border:
    1px solid
    var(--border);

  box-shadow:
    var(--shadow);

  cursor:pointer;

  transition:
    transform .18s ease;
}

.service-card:active{
  transform:scale(.985);
}

.service-image{
  width:107px;
  height:106px;

  flex:0 0 auto;

  overflow:hidden;

  position:relative;

  border-radius:21px;

  background:
    linear-gradient(
      145deg,
      #e9edf0,
      #f4f6f7
    );
}

.service-image img{
  width:100%;
  height:100%;

  display:block;

  object-fit:cover;
}

.service-copy{
  flex:1;
  min-width:0;
}

.service-name{
  font-size:18px;
  font-weight:900;
}

.service-desc{
  margin-top:5px;

  color:#76848a;

  font-size:12px;
  line-height:1.65;

  font-weight:600;
}

.service-arrow{
  width:38px;
  height:38px;

  flex:0 0 auto;

  display:grid;
  place-items:center;

  border-radius:14px;

  color:#617178;

  background:#f3f5f7;
}

.service-arrow svg{
  width:18px;
  height:18px;
}

/* =========================
   تواصل الرئيسية
========================= */

.quick-contact{
  margin:
    14px
    14px
    0;

  padding:12px;

  display:grid;

  grid-template-columns:
    1.35fr 1fr;

  gap:9px;

  border-radius:23px;

  background:#fff;

  border:1px solid var(--border);

  box-shadow:var(--shadow);
}

.quick-call,
.quick-wa{
  min-height:54px;

  display:flex;
  align-items:center;
  justify-content:center;
  gap:8px;

  border-radius:17px;

  font-size:13.5px;
  font-weight:900;
}

.quick-call{
  color:#315fb7;
  background:#eff4fc;
}

.quick-wa{
  color:#19765b;
  background:#f0f8f5;
}

.quick-contact svg{
  width:20px;
  height:20px;
}

/* =========================
   التفاصيل
========================= */

.detail-page{
  padding:
    18px
    14px
    28px;
}

.detail-head{
  padding:13px;

  border-radius:29px;

  background:#fff;

  border:
    1px solid
    var(--border);

  box-shadow:
    var(--shadow-lg);
}

.detail-title{
  padding:
    8px
    7px
    15px;
}

.detail-title h2{
  margin:0;

  font-size:27px;
  font-weight:900;
}

.detail-title p{
  margin:
    3px
    0
    0;

  color:#7b888d;

  font-size:12px;
  font-weight:650;
}

/* =========================
   صور العقاري
========================= */

.property-gallery{
  height:205px;

  display:grid;

  grid-template-columns:
    1.45fr 1fr;

  gap:7px;
}

.property-side{
  display:grid;

  grid-template-rows:
    1fr 1fr;

  gap:7px;
}

.real-photo{
  overflow:hidden;

  border-radius:19px;

  background:
    linear-gradient(
      145deg,
      #e7ebee,
      #dfe4e7
    );
}

.real-photo img{
  width:100%;
  height:100%;

  display:block;

  object-fit:cover;
}

/* =========================
   الشخصي
========================= */

.personal-gallery{
  height:195px;

  display:grid;

  grid-template-columns:
    1.4fr 1fr;

  gap:7px;
}

.money-image{
  overflow:hidden;

  border-radius:19px;

  background:#e9edef;
}

.money-image img{
  width:100%;
  height:100%;

  object-fit:cover;
}

.personal-side{
  display:grid;

  grid-template-rows:
    1fr 1fr;

  gap:7px;
}

.riyal-box,
.speed-box{
  display:flex;

  align-items:center;
  justify-content:center;

  flex-direction:column;

  border-radius:18px;
}

.riyal-box{
  color:#1b7258;

  background:
    linear-gradient(
      145deg,
      #edf7f2,
      #fff
    );

  border:
    1px solid
    rgba(25,123,91,.10);
}

.money-note{
  width:82px;
  height:45px;

  margin-bottom:5px;

  position:relative;
}

.money-note::before,
.money-note::after{
  content:"";

  position:absolute;

  inset:0;

  border-radius:7px;

  background:#e5f2ec;

  border:
    1px solid
    rgba(23,120,89,.17);
}

.money-note::before{
  transform:rotate(-5deg);
}

.money-note::after{
  transform:rotate(3deg);
}

.money-note strong{
  position:absolute;

  inset:0;

  z-index:3;

  display:flex;

  align-items:center;
  justify-content:center;

  font-size:16px;
  font-weight:900;
}

.riyal-box small{
  color:#789087;

  font-size:9px;
  font-weight:800;
}

.speed-box{
  color:#a26e21;

  background:
    linear-gradient(
      145deg,
      #fff3dd,
      #fff
    );

  border:
    1px solid
    rgba(191,132,40,.10);
}

.speed-box svg{
  width:31px;
  height:31px;
}

.speed-box strong{
  margin-top:5px;

  font-size:10px;
  font-weight:900;
}

/* =========================
   المحتوى
========================= */

.content-card{
  margin-top:14px;

  padding:18px;

  border-radius:26px;

  background:#fff;

  border:
    1px solid
    var(--border);

  box-shadow:
    var(--shadow);
}

.question-card{
  margin-bottom:14px;
